<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='tienda.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='categorias.css') }}">
    <title>Buscar por categoría</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/iso.png') }}">
</head>
<body>
    <main>
        <header>
            <nav class="navbar">
                <a class="isotipo" href="{{ url_for('index') }}">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo de la marca">
                </a>
                <ul class="nav-links">
                </ul>
            </nav>
            <h1>Buscar por categoría</h1>
        </header>

        <section class="buscador-categorias">
            <div class="encabezado-categorias">
                <h2>Elegí una categoría</h2>
                <p>Las opciones se cargan desde las categorías disponibles en la base de datos.</p>
            </div>
            <div id="lista-categorias" class="lista-categorias" aria-live="polite">
                <p>Cargando categorías...</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='Categorias.js') }}"></script>
</body>
</html>
